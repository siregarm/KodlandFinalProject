<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="../static/css/style.css">
  <title>Pustaka programmer</title>
</head>
<body>
  <header class="header">
    <img src="../static/img/new_logo.png" alt="logo" width="50" height="50">

    <ul class="main-list">
      <li class="list__item">
        <a href="">
          <img src="https://static.vecteezy.com/system/resources/previews/046/010/545/non_2x/user-icon-simple-design-free-vector.jpg" alt="login" width="50" height="50">
        </a>
      </li>
    </ul>
  </header>

  <main class="main">

    <h1 class="main__title">{{ card.title }}</h1>

    <div class="main__block">

      <h2 class="main__subtitle">
        {{ card.subtitle }}
      </h2>

      <div class="main__text">
        {{ card.text }}
      </div>

      <a class="main__link" href="/index">
        Kembali ke entri
      </a>

    </div>

  </main>

  <footer></footer>
</body>
</html>
