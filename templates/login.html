<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Journal</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <header class="header">
        <img src="../static/img/new_logo.png" alt="logo" width="50" height="50">
        <ul class="main-list">

        </ul>
      </header>
      <main class="main-login">
        {% block content %}
        <form action="{{ url_for('login') }}" method="POST" class="login">
            <h1>Green Journal</h1>
            <h2>Menulis kegiatan jejak hijau!</h2>
            <p class="error">{{error}}</p>

            <!-- Tugas #2. Membuat kolom login -->
            <label for="email">
                <input class="form__input" type="email" name="email" id="email" placeholder="Masukkan alamat email Anda" required>
            </label>
            <label for="password">
                <input class="form__input" type="password" name="password" id="password" placeholder="Masukkan kata sandi Anda" required>
            </label>
            

            <!--  -->
                <button class="form__button">Masuk</button>
                <a href="/reg" class="form__button reg__link">Daftar</a>
        </form>
        {% endblock %}
      </main>
</body>
</html>
